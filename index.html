<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAC Reports Pro</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0A3D8F"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#eef2ff}header{background:#0A3D8F;color:#fff;padding:14px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}header img{width:52px;height:52px;border-radius:12px;background:#fff;object-fit:cover}nav{display:flex;background:#fff;position:sticky;top:0;z-index:10}nav button{flex:1;padding:12px 4px;border:0;background:#fff;font-weight:800;border-bottom:3px solid transparent;font-size:12px}nav button.active{border-color:#FFD700;color:#0A3D8F;background:#fffbe6}.tab{display:none;padding:12px;max-width:700px;margin:auto}.tab.active{display:block}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 14px #0001;margin-bottom:12px}.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dash.card{text-align:center}dash b{font-size:22px;color:#0A3D8F}label{display:block;font-size:10px;font-weight:800;color:#445;margin:10px 0 3px;text-transform:uppercase}input{width:100%;padding:11px;border:2px solid #dde;border-radius:9px;font-size:15px}.btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;margin-top:10px;background:#0A3D8F;color:#fff}.gold{background:#FFD700;color:#000}.small{padding:6px 10px;font-size:12px;width:auto;margin:2px;border-radius:7px;border:0;font-weight:700}.edit{background:#1976d2;color:#fff}.del{background:#d32f2f;color:#fff}.rep{border:1px solid #eee;border-radius:10px;padding:10px;margin-bottom:8px;background:#fafcff}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:30px;display:none;z-index:99}</style></head><body><header><img src="IMG-20261015-WA6264.jpg" onerror="this.src='icon.png'"><div><h1 style="margin:0;font-size:18px">† NAC SEPIK REPORTS</h1><p style="margin:0;font-size:11px">Dashboard • Report Manager</p></div></header><nav><button class="active" onclick="showTab('dash',this)">Dashboard</button><button onclick="showTab('new',this)">New Report</button><button onclick="showTab('mgr',this)">Manager</button><button onclick="showTab('sum',this)">Summary</button></nav><div id="dash" class="tab active"><div class="dash"><div class="card"><b id="dTotal" style="font-size:22px;display:block;color:#0A3D8F">0</b>Total Reports</div><div class="card"><b id="dOff" style="font-size:22px;display:block;color:#0A3D8F">K0</b>Offering</div><div class="card"><b id="dAtt" style="font-size:22px;display:block;color:#0A3D8F">0</b>Attendance</div><div class="card"><b id="dDist" style="font-size:22px;display:block;color:#0A3D8F">0</b>Districts</div></div><div class="card"><h3>Recent Reports</h3><div id="dRecent"></div></div></div><div id="new" class="tab"><div class="card"><h3 id="formTitle">New Report</h3><label>Receipt No. *</label><input id="receiptNo"><label>Congregation *</label><input id="cong" placeholder="Hambeli"><label>District * - TYPE ANY FREE TEXT</label><input id="dist" list="dl" placeholder="Central Yangoru, Sawosa, any..."><datalist id="dl"><option value="Central Yangoru"><option value="Wewak"><option value="Maprik"><option value="Angoram"><option value="Vanimo"><option value="Lumi"><option value="Aitape"><option value="Sawosa"><option value="Yangoru"></datalist><label>Offering (K) *</label><input id="off" type="number" step="0.01"><label>Attendance *</label><input id="att" type="number"><label>Officiant 1 *</label><input id="o1"><label>Book No.</label><input id="bn"><button class="btn" onclick="saveR()">† SAVE REPORT</button><button class="btn gold" onclick="cancelEdit()" id="cancelBtn" style="display:none">Cancel Edit</button><button class="btn gold" onclick="exp()">Export Excel CSV</button></div></div><div id="mgr" class="tab"><div class="card"><h3>Report Manager - Edit & Delete</h3><input id="search" placeholder="Search Congregation, District, Receipt..." oninput="renMgr()" style="margin-bottom:10px"><div id="mgrList"></div></div></div><div id="sum" class="tab"><div class="card" id="sb"></div></div><div id="toast"></div><script>const K='nac_new';let R=JSON.parse(localStorage.getItem(K)||'[]');let editIdx=-1;function gen(){document.getElementById('receiptNo').value=String(Date.now()).slice(-8);}function showTab(i,b){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById(i).classList.add('active');b.classList.add('active');if(i=='dash')renDash();if(i=='mgr')renMgr();if(i=='sum')renS();}function toast(m){let e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2500);}function saveR(){let d={receiptNo:document.getElementById('receiptNo').value.trim(),cong:document.getElementById('cong').value.trim(),dist:document.getElementById('dist').value.trim(),offering:parseFloat(document.getElementById('off').value)||0,att:parseInt(document.getElementById('att').value)||0,o1:document.getElementById('o1').value.trim(),bookNo:document.getElementById('bn').value.trim(),dateSaved:new Date().toLocaleString()};if(!d.cong||!d.dist||!d.att||!d.o1){toast('Fill Congregation, District, Attendance, Officiant1');return;}if(editIdx>=0){R[editIdx]=d;editIdx=-1;document.getElementById('formTitle').textContent='New Report';document.getElementById('cancelBtn').style.display='none';toast('Updated!');}else{R.unshift(d);toast('Saved: '+d.cong);}localStorage.setItem(K,JSON.stringify(R));gen();['cong','dist','off','att','o1','bn'].forEach(id=>document.getElementById(id).value='');renDash();renMgr();renS();showTab('dash',document.querySelector('nav button'));}function editReport(i){let r=R[i];editIdx=i;document.getElementById('receiptNo').value=r.receiptNo;document.getElementById('cong').value=r.cong;document.getElementById('dist').value=r.dist;document.getElementById('off').value=r.offering;document.getElementById('att').value=r.att;document.getElementById('o1').value=r.o1;document.getElementById('bn').value=r.bookNo||'';document.getElementById('formTitle').textContent='Editing #'+r.receiptNo;document.getElementById('cancelBtn').style.display='block';showTab('new',document.querySelectorAll('nav button')[1]);window.scrollTo(0,0);}function cancelEdit(){editIdx=-1;document.getElementById('formTitle').textContent='New Report';document.getElementById('cancelBtn').style.display='none';gen();['cong','dist','off','att','o1','bn'].forEach(id=>document.getElementById(id).value='');}function del(i){if(confirm('Delete this report?')){R.splice(i,1);localStorage.setItem(K,JSON.stringify(R));renDash();renMgr();renS();toast('Deleted');}}function renDash(){document.getElementById('dTotal').textContent=R.length;document.getElementById('dOff').textContent='K'+R.reduce((s,r)=>s+r.offering,0).toFixed(2);document.getElementById('dAtt').textContent=R.reduce((s,r)=>s+r.att,0);document.getElementById('dDist').textContent=new Set(R.map(r=>r.dist)).size;let rc=document.getElementById('dRecent');if(!R.length){rc.innerHTML='No reports yet';return;}rc.innerHTML=R.slice(0,5).map(r=>`<div class="rep"><b>${r.cong}</b> - ${r.dist}<br>K${r.offering} | Att ${r.att} | ${r.dateSaved}</div>`).join('');}function renMgr(){let q=(document.getElementById('search').value||'').toLowerCase();let l=document.getElementById('mgrList');let f=R.map((r,i)=>({...r,_i:i})).filter(r=>!q||(`${r.cong} ${r.dist} ${r.receiptNo}`.toLowerCase().includes(q)));if(!f.length){l.innerHTML='No matching reports';return;}l.innerHTML=f.map(r=>`<div class="rep"><b>${r.cong}</b> (${r.dist})<br>#${r.receiptNo} • K${r.offering} • Att ${r.att}<br><small>${r.dateSaved} • ${r.o1}</small><br><button class="small edit" onclick="editReport(${r._i})">✏️ Edit</button><button class="small del" onclick="del(${r._i})">🗑️ Delete</button></div>`).join('');}function renS(){let b=document.getElementById('sb');if(!R.length){b.innerHTML='No data';return;}let tot=R.reduce((s,r)=>s+r.offering,0);let at=R.reduce((s,r)=>s+r.att,0);let by={};R.forEach(r=>{by[r.dist]=(by[r.dist]||0)+r.offering});b.innerHTML=`<h3>Summary by District</h3>Reports: ${R.length}<br>Total K${tot.toFixed(2)}<br>Attendance ${at}<hr>${Object.entries(by).map(([k,v])=>`${k}: K${v.toFixed(2)}`).join('<br>')}`;}function exp(){if(!R.length){toast('No data');return;}let csv='Receipt,Congregation,District,Offering,Attendance,Officiant1,Date\n';R.slice().reverse().forEach(r=>{csv+=`"${r.receiptNo}","${r.cong}","${r.dist}",${r.offering},${r.att},"${r.o1}","${r.dateSaved}"\n`;});let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NAC_Reports.csv';a.click();}gen();renDash();renS();if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script></body></html>
